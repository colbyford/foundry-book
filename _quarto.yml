project:
  type: book

book:
  title: "Building Agentic Solutions with Microsoft Foundry"
  subtitle: "Patterns, Workflows, and Best Practices for Intelligent Agents"
  author: "Colby T. Ford"
  date: "06/01/2026"
  site-url: https://foundry-book.ai
  repo-url: https://github.com/colbyford/foundry-book
  cover-image: img/Building Agentic Solutions with Microsoft Foundry_cover_bw.png
  chapters:
    - index.qmd
    - 0_preface.qmd
    - 1_intro.qmd
    - 2_model_deployment.qmd
    - 3_agent_deployment.qmd
    - 4_knowledge_bases.qmd
    - 5_model_customization.qmd
    # - 6_agent_management.qmd
    # - 7_edge_deployment.qmd
    # - 8_conclusion.qmd

# bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - brand
    code-link: true
    code-overflow: scroll
    lightbox: true
    author-meta: "Colby T. Ford"
    include-in-header:
      text: |
        <link rel="shortcut icon" href="img/squirrel_bw_sq.png" />
        <link rel="icon" type="image/x-icon" href="img/squirrel_bw_sq.png" />

  pdf:
    documentclass: scrreprt
    fig-pos: 'H'
    code-overflow: wrap
    ## Code wrapping in PDF
    include-in-header: 
      text: |
        \usepackage{float}
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{
          commandchars=\\\{\},
          breaklines, breaknonspaceingroup, breakanywhere
        }

  asciidoc: default


